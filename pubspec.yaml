name: cataract_surgery_note
description: "白内障手術の工程時間、動画レビュー、振り返り、分析を端末内に記録するアプリ。"
publish_to: 'none'
version: 1.0.0+25

environment:
  sdk: ^3.13.1
  flutter: '>=3.47.1'

dependencies:
  drift: ^2.34.0
  drift_flutter: ^0.3.0
  file_picker: ^11.0.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  intl: ^0.20.2
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  uuid: ^4.5.3
  video_player: ^2.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  video_player_platform_interface: ^6.9.0

flutter:
  # file_picker の写真・音声コードを CocoaPods のフラグで除外するため、
  # v1.0.0 では Swift Package Manager へ自動移行しない。
  config:
    enable-swift-package-manager: false
  uses-material-design: true

hooks:
  user_defines:
    sqlite3:
      source: system
      name: sqlite3
